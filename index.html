<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator</title>

    <!-- Bootstrap css is Linked. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container mt-5 pb-5 rounded-3 text-center">
        <h3 class="logo">iCET</h3>
        <h2 class="heading">TAX CALCULATOR</h2>

        <div class="row mt-4">
            <div class="col">
                <select class="form-select" aria-label="Default select example" id="tax_type">
                    <option selected>Select tax category</option>
                    <option value="1">Withholding Tax</option>
                    <option value="2">Payable Tax</option>
                    <option value="3">Income Tax</option>
                    <option value="4">Social Security Contribution Levy (SSCL) Tax</option>
                    <option value="5">Leasing Payment</option>
                </select>
            </div>

            <div class="col" id="tax_category_dd">
                <!-- Changed as per response. -->
            
            </div>

        </div>

        <div class="row mt-5">

            <div class="col-6">
                
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon3">Enter Value</span>
                    <input type="text" class="form-control" id="input" aria-describedby="basic-addon3 basic-addon4">
                </div>
            </div>
            
            <div class="col-3">
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon3">Number of Year</span>
                    <input type="text" class="form-control" id="input_year" aria-describedby="basic-addon3 basic-addon4">
                </div>
            </div>
            <div class="col-3">
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon3">Annual Interest Rate</span>
                    <input type="text" class="form-control" id="input_rate" aria-describedby="basic-addon3 basic-addon4">
                </div>

            </div>

        </div>

        <div class="row">
            <div class="col">    
            </div>
            <div class="col">
                <button class="btn btn-outline-secondary" type="button" id="button-addon2">Calculate</button>
            </div>
            <div class="col">    
            </div>
        </div>

        <div class="row">
            <div class="col-3">
            </div>
            <div class="col-6" id="display">
                <p><img src="assets/img/icon_loading.png" alt=""></p>
            </div>
        </div>
        

    </div>

    <script src="assets/js/app.js"></script>
    <!-- Bootstrap script is Linked. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
